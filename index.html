<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDS Toolkit — Silver Dev Studio</title>
  <meta name="description" content="A collection of free, privacy-friendly tools that run locally in your browser. Developer utilities, file tools, creative generators, and writing helpers — nothing ever leaves your device." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0e10'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' fill='%23e3b56b' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Martian+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="grain" aria-hidden="true"></div>
  <main-hud aria-hidden="true" id="hud"></main-hud>
  <header class="site-header">
    <a class="brand" href="#/" data-nav>
      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-name">SDS&nbsp;<em>Toolkit</em></span>
      <span class="brand-line" aria-hidden="true"></span>
      <span class="brand-tag">local-only</span>
    </a>
    <div class="header-actions">
      <span class="privacy-pill" title="Every tool runs in your browser. No uploads, no tracking, no servers.">
        <span class="dot" aria-hidden="true"></span> 100% on-device
      </span>
    </div>
    <div class="tools-trigger" id="toolsTrigger">
      <button type="button" id="toolsMenuBtn" aria-haspopup="true" aria-expanded="false">
        <span>Tools</span>
        <span class="caret" aria-hidden="true"></span>
      </button>
      <div class="tools-menu" id="toolsMenu" role="menu" aria-label="All tools">
        <div class="tools-menu-top">
          <span class="mono-label dim">All workbenches</span>
          <form class="tools-search" data-nav role="search">
            <span class="search-ico" aria-hidden="true">⌕</span>
            <input type="search" id="toolsSearch" placeholder="Filter tools…" autocomplete="off" spellcheck="false" />
            <kbd class="search-kbd">/</kbd>
          </form>
        </div>
        <div class="tools-menu-cats" id="toolsMenuCats"></div>
        <div class="tools-menu-empty" id="toolsMenuEmpty" hidden>No tools match that filter.</div>
        <footer class="tools-menu-foot">
          <a class="btn ghost small" href="#/" data-nav><span class="arrow">←</span> All tools</a>
          <span class="tools-menu-hint dim">nothing leaves your browser</span>
        </footer>
      </div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer">
    <span>© <span id="year"></span> Silver Dev Studio — a home for small tools that solve real problems.</span>
    <span class="footer-note">Everything runs locally in your browser. Nothing is uploaded, ever.</span>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
